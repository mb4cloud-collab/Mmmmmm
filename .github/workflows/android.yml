name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip setuptools buildozer kivy Cython

    - name: Build APK with Buildozer
      run: |
        # إنشاء ملف buildozer.spec افتراضي تلقائياً
        buildozer init
        # تعديل الإعدادات لتناسب المشروع
        sed -i 's/package.name = myapp/package.name = orbitalpredictor/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.mb4x/' buildozer.spec
        sed -i 's/title = My Application/title = MB4X Orbital Predictor/' buildozer.spec
        # بدء عملية التجميع
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MB4X-Orbital-Predictor-APK
        path: bin/*.apk


