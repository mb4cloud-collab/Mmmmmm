name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & AIDL
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev \
                                aidl zlib1g-dev ccache lld libncurses5

    - name: Install Buildozer & Kivy
      run: |
        pip install --upgrade pip setuptools buildozer kivy Cython

    - name: Build APK with Buildozer
      run: |
        # إنشاء ملف buildozer.spec افتراضي إذا لم يكن موجوداً
        if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/package.name = myapp/package.name = orbitalpredictor/' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = com.mb4x/' buildozer.spec
            sed -i 's/title = My Application/title = MB4X Orbital Predictor/' buildozer.spec
        fi
        
        # الموافقة التلقائية على شروط Android SDK وبدء البناء
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MB4X-Orbital-Predictor-APK
        path: bin/*.apk
