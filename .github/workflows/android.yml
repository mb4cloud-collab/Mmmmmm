name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev \
                                zlib1g-dev ccache lld libncurses5-dev libncursesw5-dev zip unzip openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Auto-Accept Android SDK Licenses & Build
      run: |
        if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/package.name = myapp/package.name = orbitalpredictor/' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = com.mb4x/' buildozer.spec
            sed -i 's/title = My Application/title = MB4X Orbital Predictor/' buildozer.spec
        fi

        # إنشاء ملف قبول التراخيص لجميع حزم Android SDK مسبقاً
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # الموافقة على كافة تراخيص Google أوتوماتيكياً
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/licenses || true
        printf "89339025125deb13a307b392279226b83f5dd257\nd56f518e4720455a1a5e80878a2cfb27521e1a10\n24333f8a6371fac3d3751cf26734270925539e17" > $ANDROID_HOME/licenses/android-sdk-license
        printf "84831b9402116e267a7d416e35b883a123e86e3d" > $ANDROID_HOME/licenses/android-sdk-preview-license

        # بدء البناء
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MB4X-Orbital-Predictor-APK
        path: bin/*.apk
